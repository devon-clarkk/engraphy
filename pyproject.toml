[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "engraphy"
# Single source of truth: engraphy/__init__.py's __version__. The number used to
# be written in three places (here, that module, and a literal ENGINE_VERSION in
# server/app.py that /healthz reported), with nothing keeping them equal -- a
# release that bumped one would ship a server reporting a different version than
# it was. setuptools reads the attribute statically (no import, so this does not
# drag dependencies into the build), and app.py now reads the same attribute at
# runtime, so all three can only ever agree.
dynamic = ["version"]
description = "A self-hosted memory engine for AI agents"
# Carried into the distribution metadata, so a built wheel or sdist
# describes itself with the README rather than the one-line summary alone.
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.9,<2",                 # official MCP SDK (FastMCP server API). Upper bound: mcp 2.0.0
                                 # dropped the low-level Server.list_tools/call_tool decorators the
                                 # server uses (app.py::_build_mcp_server), crash-looping boot on any
                                 # fresh build. <2 keeps the known-good 1.x line (resolves to 1.28.1).
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.7",
  "sentence-transformers>=3.0",  # loads nomic-embed-text-v1.5 (trust_remote_code pinned in embedding.py)
  "einops>=0.7",                 # required by nomic-embed-text-v1.5's remote modeling code
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "typer>=0.12",                 # engraphy-admin CLI
]

[project.optional-dependencies]
# Upper bounds on purpose. `ruff>=0.4` meant CI resolved whatever ruff was newest
# that morning, and a release that widened the default rule set turned a green
# `ruff check .` into 180 findings with no commit to blame. A linter is part of
# the build, not a dependency to float: `==` here, plus an explicit
# [tool.ruff.lint] select below, so a ruff upgrade is a reviewed change. The rest
# carry major-version caps for the same reason.
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2", "hypothesis>=6.100,<7", "ruff==0.16.4",
       "pytest-cov>=5,<7",
       "pytest-timeout>=2.3,<3"]  # a deadlocking test must fail the run, not hang it (the dedup race test contends a real advisory lock)
# The benchmark harness (design/09). Deliberately its own extra, not a runtime
# dependency: the engine must not grow an LLM client, and `pip install engraphy`
# must not drag one in. `bench/core/llm.py` imports anthropic lazily so that the
# bench test suite still collects and runs without this extra installed.
bench = ["anthropic>=0.40"]

[project.scripts]
engraphy-admin = "engraphy.admin.cli:app"

[tool.setuptools.dynamic]
version = {attr = "engraphy.__version__"}

[tool.setuptools.packages.find]
# `packs*` ships the pack JSON Schema + starter pack (see packs/__init__.py).
include = ["engraphy*", "packs*", "bench*"]

# Runtime data files that code locates RELATIVE TO ITS OWN MODULE. Without
# these, `pip install .` produced a package whose admin verbs could not find
# their own assets -- `engraphy-admin migrate` failed with dbmate's "could not
# find migrations directory" and `pack validate|apply` with
# FileNotFoundError on site-packages/packs/schema.json. The install paths below
# are chosen to match the existing resolution exactly, so no code changes:
#   engraphy/admin/migrate.py -> parents[1]/db/migrations  -> engraphy/db/migrations
#   engraphy/server/app.py    -> parents[1]/db/migrations  -> engraphy/db/migrations
#   engraphy/admin/packs.py   -> parents[2]/packs/schema.json -> packs/schema.json
[tool.setuptools.package-data]
"engraphy.db" = ["migrations/*.sql"]
"packs" = ["schema.json", "starter/*.yaml"]

[tool.ruff]
line-length = 100

# Ruff's DEFAULT rule set is not a stable contract: it expands between releases.
# This repo rode the default and a newer ruff turned a green `ruff check .` into
# 180 findings across 24 rules that nobody had opted into. Both halves of the fix
# matter -- the version is pinned in [project.optional-dependencies].dev, and the
# rules are enumerated here, so a ruff upgrade is a deliberate, reviewable change
# rather than a surprise CI failure. Enumerate NARROWLY: bare "S" or "PL" would
# pull in all of bandit / all of pylint (including the PLR complexity rules),
# which is a much larger gate than what is actually being asked for.
[tool.ruff.lint]
select = [
  "E4", "E7", "E9",  # pycodestyle errors (ruff's historical default, minus E5 line-length)
  "F",               # pyflakes
  "B",               # flake8-bugbear
  "SIM",             # flake8-simplify
  "UP",              # pyupgrade
  "RUF",             # ruff-specific
  "ISC",             # implicit string concat
  "FURB",            # refurb
  "PLC", "PLW",      # pylint convention + warning only (NOT PLR: complexity metrics)
  "ASYNC",           # flake8-async
  "BLE",             # blind except
  "DTZ",             # naive datetimes
  "S112",            # try-except-continue that swallows the exception silently
]
ignore = [
  # Typographic characters in bench report output are deliberate: the tables
  # print en dashes, minus signs and multiplication signs because that is what
  # the rendered report should read like. Rewriting them to ASCII would change
  # shipped output to satisfy a lint about homoglyph confusion that does not
  # apply to prose.
  "RUF001", "RUF002", "RUF003",
  # `strict=` on zip() is a per-call-site decision about whether unequal lengths
  # are a bug or expected truncation. That judgement belongs with whoever writes
  # the call, not to a blanket sweep that would either add no-op `strict=False`
  # everywhere or change behaviour at eight sites at once.
  "B905",
  # engraphy/core/embedding.py::_model and engraphy/server/db.py::_pool are
  # intentional module-level lazy singletons -- the embedding model and the
  # connection pool are process-wide by design and must not be rebuilt per call.
  "PLW0603",
  # Lazy/function-local imports are a deliberate architectural device here, not
  # an oversight: bench/core/llm.py imports `anthropic` inside the function so
  # the engine's dependency closure stays free of an LLM client (see the `bench`
  # extra above), and several admin verbs defer heavy imports to keep CLI
  # start-up cheap. 64 call sites implement that pattern on purpose.
  "PLC0415",
  # `raise ... from exc` is a genuine improvement, but it was never part of the
  # rule set this repo was gated on, and adopting it is 25 edits to exception
  # paths. Worth doing as its own reviewed commit, not smuggled into a CI fix.
  "B904",
  # ruff's own safe fix already collapsed every straightforward nested `with`.
  # What it declined to touch is what remains: blocks where collapsing forces a
  # >100-char line to be re-wrapped, and `pytest.raises(...)` wrapping a context
  # manager, where the nesting is the thing under test. Re-indenting those by
  # hand is churn with no behavioural content.
  "SIM117",
]
# NOT selected, deliberately: "I" (isort). Enabling it rewrites the import block
# of 33 files at once. That is pure ordering churn with no correctness content,
# and it collides head-on with any in-flight branch that touches import lines.
# Worth adopting on its own commit, when no large rename is in flight.

[tool.ruff.lint.per-file-ignores]
# Test modules import shared pytest fixtures from sibling test modules (e.g.
# `from engraphy.tests.test_dedup import write_space`) and reuse them as test-
# function parameters -- the standard pytest idiom, which ruff reads as F811
# redefinition. Ignore F811 in the test tree; it is not a real redefinition bug.
"engraphy/tests/**" = ["F811"]
"bench/tests/**" = ["F811"]  # same cross-module fixture idiom as the engine tests

[tool.pytest.ini_options]
# The harness's tests run in the same invocation as the engine's. They are
# hermetic by construction (no LLM calls -- `bench/core/llm.py` is behind a seam
# that tests stub), so adding them here does not make the default run require
# network or the `bench` extra.
testpaths = ["engraphy/tests", "bench/tests"]
asyncio_mode = "auto"
