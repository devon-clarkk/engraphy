name: release

# Cutting a release is `git tag vX.Y.Z && git push --tags`. Everything below
# follows from the tag: the distributions are built and attached to a GitHub
# release, and the two container targets are published to GHCR in both embedder
# variants.
#
# ci.yml also triggers on `v*` tags, so the full test matrix runs against the
# tagged commit alongside this workflow.
on:
  push:
    tags: ['v*']

# Read-only by default; each job widens only to what it needs.
permissions:
  contents: read

jobs:
  # Build the sdist + wheel, prove the tag and the packaged version agree, and
  # publish the GitHub release with the distributions attached.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release and upload its assets
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}

      # A tag that disagrees with engraphy.__version__ ships a wheel whose
      # version is not the one being announced. Catch it here, before the
      # release exists, rather than leaving a mislabelled artifact published.
      - name: tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("engraphy/__init__.py").read_text()).group(1))')"
          echo "tag=$tag packaged=$pkg"
          test "$tag" = "$pkg" || {
            echo "tag $GITHUB_REF_NAME does not match engraphy.__version__ ($pkg)"; exit 1; }

      - name: build sdist + wheel
        run: |
          pip install "build==1.3.0" "twine==6.2.0"
          python -m build
          twine check dist/*

      # --generate-notes writes the commit log since the previous tag. A release
      # already created for this tag is reused, so a re-run repairs a partial
      # publish instead of failing on it.
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "Engraphy ${GITHUB_REF_NAME}" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # The VS Code extension's .vsix, attached to the release.
  #
  # Editors whose gallery is the VS Code Marketplace install and update the
  # extension themselves. Editors that read Open VSX (VSCodium, Cursor,
  # Windsurf, Theia) install it from a file, and the release is where that file
  # comes from: without it, the only way to get the extension into those editors
  # is to build it, and the only way to update it is to build it again.
  #
  # The extension carries its OWN version, which is not this tag. The tag is the
  # engine's. `vsce package` names the file from the extension manifest, so the
  # asset records the extension version even though the release is named for the
  # engine, and engraphy-web/build-version.py reads that filename to fill in the
  # manifest. Nothing here needs the two numbers to agree.
  #
  # `needs: release` and nothing needing this: a packaging failure here leaves
  # the release, the distributions and the images exactly as they were.
  extension:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write        # upload one more asset to the existing release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: package the extension
        working-directory: vscode-extension
        run: |
          npm ci
          npx --yes @vscode/vsce package --out engraphy.vsix

      # Renamed to carry the extension's own version, because the file sits in a
      # release named for the engine and "engraphy.vsix" would say nothing about
      # which build it is. build-version.py matches this exact shape.
      - name: attach it to the release
        working-directory: vscode-extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          mv engraphy.vsix "engraphy-${version}.vsix"
          gh release upload "$GITHUB_REF_NAME" "engraphy-${version}.vsix" --clobber

  # Both Dockerfile targets in both embedder variants, published to GHCR under
  # the repository's namespace. Authentication is the workflow's own
  # GITHUB_TOKEN plus `packages: write`; no personal access token is configured
  # or needed for a push to this repo's own package namespace.
  #
  # The variant axis carries no version of its own and no separate trigger. It
  # is a second value in this matrix, so a tag publishes the micro images by the
  # same mechanism and in the same run as the default ones, and cutting a
  # release stays `git tag && git push --tags` with nothing to remember. A
  # variant that needed its own workflow, its own tag or its own manual step
  # would drift out of step with the default images the first time someone was
  # in a hurry.
  image:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write        # push to ghcr.io/<owner>/<repo>
    strategy:
      fail-fast: false
      matrix:
        target: [server, admin]
        # `profile` is the ENGRAPHY_EMBEDDING_PROFILE baked into the image, and
        # `suffix` is what that variant appends to the version tag. The default
        # variant passes an empty profile so the Dockerfile's build arg stays
        # unset and the image runs embedding.DEFAULT_PROFILE, which is where the
        # default belongs: here it would be a second place to update.
        variant:
          - {profile: '', suffix: ''}
          - {profile: micro, suffix: '-micro'}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # One package per target rather than one package with suffixed tags:
      # `docker pull ghcr.io/<owner>/engraphy` gets the server, and
      # `<owner>/engraphy-admin` gets the sidecar, each with its own `latest`.
      # Tags are the exact version and the X.Y line.
      #
      # The variant is a TAG SUFFIX on those same two packages, not a third and
      # fourth package: `engraphy:0.2.0-micro` sits beside `engraphy:0.2.0`, so
      # an operator moving to micro changes a tag rather than an image name, and
      # the two variants of one release stay visibly one release. The suffix is
      # applied per pattern rather than through `flavor:` so that `latest` keeps
      # pointing at the default variant without a further rule.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.target == 'admin' && '-admin' || '' }}
          tags: |
            type=semver,pattern={{version}},suffix=${{ matrix.variant.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.variant.suffix }}

      # ENGRAPHY_EMBEDDING_PROFILE is read twice from this one value, and that is
      # the property that keeps the variant maintenance-free. The Dockerfile
      # turns the build arg into a persisted ENV, so the profile that gets
      # prebaked into the image's model cache is also the profile the container
      # runs, and the two cannot drift apart. Passing an empty string leaves the
      # arg unset, which is the default variant.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            ENGRAPHY_EMBEDDING_PROFILE=${{ matrix.variant.profile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per (target, variant). One shared gha scope would have the
          # four builds evicting each other's layers on every release, since
          # they diverge at the prebake step and each would rewrite the cache.
          cache-from: type=gha,scope=${{ matrix.target }}${{ matrix.variant.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}${{ matrix.variant.suffix }}
