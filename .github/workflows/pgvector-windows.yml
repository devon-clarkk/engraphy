name: pgvector-windows

# Builds pgvector for native Windows Postgres and proves the result works, so
# that the Docker-free Windows distribution (docs/windows-native.md) can ship a
# prebuilt `vector.dll` instead of asking the machine that installs Engraphy to
# carry a C toolchain.
#
# WHY THIS EXISTS
#
# pgvector publishes no Windows binaries. Its documented Windows build is
# `nmake /F Makefile.win` inside an "x64 Native Tools Command Prompt for VS",
# which means Visual Studio with the C++ workload, a multi-gigabyte developer
# install, on the laptop of someone whose job is not writing software. Third
# party prebuilt DLLs are not an option either: a native library loaded into the
# database backend has to come from a build whose inputs are visible, and it has
# to be built against the SAME Postgres major and MSVC runtime as the server it
# loads into or it fails to load, or worse, loads and crashes the backend.
#
# `windows-latest` already carries MSVC, so the build happens here once, in
# public, from pinned sources, and the artifact ships. Nobody downstream
# compiles anything.
#
# WHAT IS PINNED, AND WHY EACH PIN IS A HASH
#
#   pgvector      by commit SHA, not by tag: a tag is a moveable ref.
#   PostgreSQL    by exact version URL AND sha256 of the archive. EDB's
#                 "latest 16.x" redirect moves on every patch release, which
#                 would silently change the headers this links against.
#
# The verify step is the substance, not a formality: it initdb's a cluster from
# the same Postgres tree the installer bundles, loads the DLL that was just
# built, and runs a 384-dimension cosine query through an HNSW index, checking
# that the plan actually used the index. A `vector.dll` that compiled but cannot
# be loaded by the server shipping beside it is the failure this catches.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the artifact to this existing release tag (optional)'
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
  # Keeps the workflow honest: a change to it, or to the probe it runs, is
  # proved by running it.
  pull_request:
    paths:
      - '.github/workflows/pgvector-windows.yml'
      - 'deploy/windows/pgvector-probe.sql'

permissions:
  contents: read

env:
  # PostgreSQL 16, matching compose.yaml's `pgvector/pgvector:pg16`, the
  # `postgresql-client-16` pin in the Dockerfile and CI, and the major the
  # Windows installer bundles. All four move together or none of them do.
  PG_VERSION: '16.15-3'
  PG_URL: 'https://get.enterprisedb.com/postgresql/postgresql-16.15-3-windows-x64-binaries.zip'
  PG_SHA256: '5e8afffe67daf949aeeb03b74951f1ec2324e1888f73fbd036ab0e567ab004d9'
  # pgvector v0.8.6.
  PGVECTOR_REF: '8ee86c96f0fd72390f890aa8a336fda6d3ab4c6c'
  PGVECTOR_VERSION: '0.8.6'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      # Only the optional release-upload step needs this. Every other step is
      # read-only, and on a pull_request there is no tag to attach to, so that
      # step does not run at all.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: fetch the PostgreSQL binaries EDB publishes for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $env:PG_URL -OutFile pg.zip
          $got = (Get-FileHash pg.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:PG_SHA256) {
            throw "PostgreSQL archive sha256 is $got, expected $env:PG_SHA256"
          }
          Expand-Archive pg.zip -DestinationPath "${{ github.workspace }}/pg"
          # The archive unpacks to a single `pgsql` root.
          "PGROOT=${{ github.workspace }}/pg/pgsql" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: the headers this builds against are the ones that ship
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:PGROOT/bin/pg_config.exe" --version
          # postgres.lib is what Makefile.win links the extension against. Its
          # absence would mean a client-only archive, and a DLL no server could
          # load.
          if (-not (Test-Path "$env:PGROOT/lib/postgres.lib")) { throw 'no postgres.lib in the archive' }
          if (-not (Test-Path "$env:PGROOT/include/server/postgres.h")) { throw 'no server headers in the archive' }

      - name: fetch pgvector at the pinned commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git init pgvector
          cd pgvector
          git remote add origin https://github.com/pgvector/pgvector.git
          git fetch --depth 1 origin $env:PGVECTOR_REF
          git checkout FETCH_HEAD
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:PGVECTOR_REF) { throw "checked out $head, expected $env:PGVECTOR_REF" }
          # The version in the source has to be the version the artifact is
          # named for, or the installer ships a mislabelled extension.
          $control = Get-Content vector.control -Raw
          if ($control -notmatch "default_version\s*=\s*'$env:PGVECTOR_VERSION'") {
            throw "vector.control does not declare $env:PGVECTOR_VERSION"
          }

      # nmake and cl come from the VS build environment, which is on the runner
      # but not on PATH. vswhere locates the installation rather than hardcoding
      # an edition and year the runner image is free to change.
      - name: build with MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          if "%VSPATH%"=="" (echo no Visual Studio with the C++ toolset & exit /b 1)
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cd pgvector
          nmake /F Makefile.win || exit /b 1
          nmake /F Makefile.win install || exit /b 1

      - name: collect the artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "${{ github.workspace }}/artifact"
          New-Item -ItemType Directory -Force -Path "$out/lib", "$out/share/extension" | Out-Null
          # `nmake install` writes into PGROOT, which is the layout the installer
          # lays down, so copying from there rather than from the build tree
          # means the artifact is exactly what a working install contains.
          Copy-Item "$env:PGROOT/lib/vector.dll" "$out/lib/"
          Copy-Item "$env:PGROOT/share/extension/vector*" "$out/share/extension/"
          Get-ChildItem -Recurse -File $out | ForEach-Object {
            $rel = $_.FullName.Substring($out.Length + 1)
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $rel
          } | Out-File -FilePath "$out/SHA256SUMS" -Encoding ascii
          @{
            pgvector = $env:PGVECTOR_VERSION
            pgvector_commit = $env:PGVECTOR_REF
            postgres_major = '16'
            postgres_version = $env:PG_VERSION
            built_at = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
            built_by = "${{ github.repository }}@${{ github.sha }}"
          } | ConvertTo-Json | Out-File -FilePath "$out/build-info.json" -Encoding utf8
          Get-Content "$out/SHA256SUMS"

      - name: load it into a real cluster and run a real query
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data = "${{ github.workspace }}/pgdata"
          $pwfile = "${{ github.workspace }}/pw.txt"
          # The password reaches initdb through a file, never a command line, so
          # it does not land in the runner's process listing.
          [System.IO.File]::WriteAllText($pwfile, [System.Guid]::NewGuid().ToString())
          & "$env:PGROOT/bin/initdb.exe" -D $data -U postgres --pwfile=$pwfile -E UTF8 --locale=C
          if ($LASTEXITCODE -ne 0) { throw 'initdb failed' }
          # 55432, not 5432: the runner image may already carry a PostgreSQL.
          & "$env:PGROOT/bin/pg_ctl.exe" -D $data -o "-p 55432 -c listen_addresses=127.0.0.1" -l "${{ github.workspace }}/pg.log" -w start
          if ($LASTEXITCODE -ne 0) { Get-Content "${{ github.workspace }}/pg.log"; throw 'pg_ctl start failed' }
          try {
            $env:PGPASSWORD = [System.IO.File]::ReadAllText($pwfile)
            & "$env:PGROOT/bin/psql.exe" -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres -d postgres -f deploy/windows/pgvector-probe.sql
            if ($LASTEXITCODE -ne 0) { throw 'pgvector did not survive a real 384-dimension HNSW query' }
          } finally {
            & "$env:PGROOT/bin/pg_ctl.exe" -D $data -m immediate stop
          }

      - uses: actions/upload-artifact@v4
        with:
          name: pgvector-${{ env.PGVECTOR_VERSION }}-pg16-windows-x64
          path: artifact
          if-no-files-found: error

      - name: attach it to a release
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "pgvector-$env:PGVECTOR_VERSION-pg16-windows-x64.zip"
          Compress-Archive -Path artifact/* -DestinationPath $name
          gh release upload "${{ inputs.release_tag }}" $name --clobber
