<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="28" height="28" role="img" aria-label="Engraphy loop mark">
  <!-- The Engraphy loop, on a transparent background so it sits on any theme.
       Verdant #4C7A59 reads on both light and dark; the app recolors it per
       theme by using this file as a CSS mask (see the brand-mark custom
       property in confirm.css).
       NOTE: an XML comment may not contain a double hyphen. Writing the CSS
       custom property here with its leading hyphens made this file invalid
       XML, so it failed to parse as an image and every masked element painted
       invisible with no error. -->
  <path d="M35 66 C6 46 19 16 50 20 C82 24 93 55 62 68 C44 75 34 59 50 50"
        fill="none" stroke="#4C7A59" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
