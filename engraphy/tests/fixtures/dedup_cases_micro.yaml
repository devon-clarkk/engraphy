# Dedup band fixtures for the `micro` embedding profile.
#
# Companion to dedup_cases.yaml, NOT a replacement: the cases and their
# expected bands are read from that file, which stays the contract for the
# fp32 vector space. Only the measured similarity differs, because int8
# quantization contracts pairwise cosine.
#
# Baselined at t_high=0.955 / t_low=0.902, inside the
# deployment image. Quantized arithmetic is platform-sensitive, so these
# are measured where the code runs, not on a developer laptop.
# Asserted within the same +/-0.02 the fp32 file uses.
- name: near_identical_auto_merge
  expect_band: merge
  similarity: 0.9917
- name: same_topic_different_incident_pending
