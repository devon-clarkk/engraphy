# Golden fixtures — attr-spec interpreter. Normative:
# design/implementation/attr-spec-interpreter-plan.md (error strings + ordering are contract).
# `expect: []` means valid; otherwise the EXACT ordered error array.
- name: valid_error_type
  spec: {attrs: {required: {severity: {enum: [low, medium, high]}, happened_at: {type: date}},
                 optional: {surface: {type: string}}, closed: true}}
  attrs: {severity: high, happened_at: "2026-07-06", surface: git}
  expect: []
- name: missing_required
  spec: {attrs: {required: {severity: {enum: [low, medium, high]}}}}
  attrs: {}
  expect: ["attrs.severity is required"]
- name: missing_required_multiple_lex_order
  spec: {attrs: {required: {severity: {enum: [low, medium, high]}, happened_at: {type: date}}}}
  attrs: {}
  expect: ["attrs.happened_at is required", "attrs.severity is required"]
  # lexicographic over req keys, not declaration order
- name: valid_all_types_present
  spec: {attrs: {required: {a: {type: int}, b: {type: number}, c: {type: bool}, d: {type: date},
                     e: {type: string}}, optional: {f: {enum: [x, y]}}, closed: true}}
  attrs: {a: 5, b: 3.14, c: true, d: "2026-01-15", e: "hello", f: x}
  expect: []
  # sanity: every value-check type passing in one pass
- name: null_is_present_but_wrong
  spec: {attrs: {required: {severity: {enum: [low, medium, high]}}}}
  attrs: {severity: null}
  expect: ["attrs.severity must be one of low|medium|high"]
  # null on a required key satisfies phase 1 (present) but fails phase 4
- name: null_optional_key_fails_type_check
  spec: {attrs: {optional: {surface: {type: string}}}}
  attrs: {surface: null}
  expect: ["attrs.surface must be a string"]
  # null on an optional key: present, so no phase-1 error; fails phase 4
- name: null_required_string_wrong_type
  spec: {attrs: {required: {title: {type: string}}}}
  attrs: {title: null}
  expect: ["attrs.title must be a string"]
- name: enum_case_sensitive
  spec: {attrs: {required: {severity: {enum: [low, medium, high]}}}}
  attrs: {severity: High}
  expect: ["attrs.severity must be one of low|medium|high"]
- name: enum_non_string_value
  spec: {attrs: {required: {severity: {enum: [low, medium, high]}}}}
  attrs: {severity: 1}
  expect: ["attrs.severity must be one of low|medium|high"]
  # enum check requires JSON type string first
- name: enum_list_order_preserved_in_message
  spec: {attrs: {required: {severity: {enum: [high, medium, low]}}}}
  attrs: {severity: nope}
  expect: ["attrs.severity must be one of high|medium|low"]
  # message lists enum values in SPEC order, never re-sorted
- name: closed_rejects_unknown
  spec: {attrs: {required: {}, optional: {}, closed: true}}
  attrs: {foo: 1}
  expect: ["attrs.foo is not allowed (closed spec)"]
- name: empty_spec_defaults_closed
  spec: {}
  attrs: {anything: x}
  expect: ["attrs.anything is not allowed (closed spec)"]
- name: open_spec_allows_unknown
  spec: {attrs: {closed: false}}
  attrs: {anything: x}
  expect: []
- name: closed_false_with_required_and_extra
  spec: {attrs: {required: {a: {type: string}}, closed: false}}
  attrs: {a: x, extra: 1}
  expect: []
  # closed: false permitted (discouraged) but must work
- name: multiple_unknown_keys_lex_order
  spec: {attrs: {closed: true}}
  attrs: {zulu: 1, alpha: 2}
  expect: ["attrs.alpha is not allowed (closed spec)", "attrs.zulu is not allowed (closed spec)"]
- name: missing_optional_section_tolerated
  spec: {attrs: {required: {a: {type: string}}, closed: true}}
  attrs: {a: x, b: y}
  expect: ["attrs.b is not allowed (closed spec)"]
  # no optional: section declared at all; b has nowhere to be known
- name: missing_required_section_tolerated
  spec: {attrs: {optional: {note: {type: string}}}}
  attrs: {}
  expect: []
  # no required: section declared at all; interpreter tolerates it as empty
- name: string_too_long
  spec: {attrs: {required: {body: {type: string}}}}
  attrs: {body: ""}
  expect: ["attrs.body must be at most 2000 characters"]
- name: string_too_long_multibyte
