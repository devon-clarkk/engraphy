- name: string_wrong_type
  spec: {attrs: {required: {note: {type: string}}}}
  attrs: {note: 123}
  expect: ["attrs.note must be a string"]
- name: int_accepts_5_point_0
  spec: {attrs: {required: {occurrences: {type: int}}}}
  attrs: {occurrences: 5.0}
  expect: []
- name: int_rejects_5_point_1
  spec: {attrs: {required: {occurrences: {type: int}}}}
  attrs: {occurrences: 5.1}
  expect: ["attrs.occurrences must be a int"]
- name: int_wrong_type
  spec: {attrs: {required: {occurrences: {type: int}}}}
  attrs: {occurrences: "5"}
  expect: ["attrs.occurrences must be a int"]
- name: number_accepts_float
  spec: {attrs: {required: {score: {type: number}}}}
  attrs: {score: 3.14}
  expect: []
- name: number_wrong_type_string
  spec: {attrs: {required: {score: {type: number}}}}
  attrs: {score: "3.14"}
  expect: ["attrs.score must be a number"]
- name: number_wrong_type_bool
  spec: {attrs: {required: {score: {type: number}}}}
  attrs: {score: true}
  expect: ["attrs.score must be a number"]
  # JSON boolean is not JSON number, even though Postgres could coerce
- name: bool_accepts_true
  spec: {attrs: {required: {active: {type: bool}}}}
  attrs: {active: true}
  expect: []
- name: bool_wrong_type_string
  spec: {attrs: {required: {active: {type: bool}}}}
  attrs: {active: "true"}
  expect: ["attrs.active must be a bool"]
- name: bool_wrong_type_number
  spec: {attrs: {required: {active: {type: bool}}}}
  attrs: {active: 1}
  expect: ["attrs.active must be a bool"]
- name: date_valid_passes
  spec: {attrs: {required: {due: {type: date}}}}
  attrs: {due: "2026-01-15"}
  expect: []
- name: date_regex_pass_cast_fail
  spec: {attrs: {required: {due: {type: date}}}}
  attrs: {due: "2026-02-30"}
  expect: ["attrs.due must be a valid ISO date"]
  # regex passes (well-formed digits), cast must fail -> the valid-ISO-date error
- name: date_another_invalid_cast
  spec: {attrs: {required: {due: {type: date}}}}
  attrs: {due: "2026-13-01"}
  expect: ["attrs.due must be a valid ISO date"]
  # month 13: regex passes, cast fails
- name: date_regex_fail
  spec: {attrs: {required: {due: {type: date}}}}
  attrs: {due: "06/07/2026"}
  expect: ["attrs.due must be a date"]
- name: date_wrong_json_type
  spec: {attrs: {required: {due: {type: date}}}}
  attrs: {due: 20260115}
  expect: ["attrs.due must be a date"]
  # a JSON number is not a JSON string; regex/cast never run
- name: conditional_fires
  spec: {attrs: {required: {method: {enum: [command, hook, manual]}},
                 optional: {command: {type: string}},
                 requires: [{key: command, when: {key: method, equals: command}}]}}
  attrs: {method: command}
  expect: ["attrs.command is required when method=command"]
- name: conditional_dormant_when_key_absent
  spec: {attrs: {optional: {command: {type: string}},
                 requires: [{key: command, when: {key: method, equals: command}}]}}
  attrs: {}
  expect: []
- name: conditional_dormant_when_key_non_string
  spec: {attrs: {required: {method: {enum: [command, hook, manual]}},
                 optional: {command: {type: string}},
                 requires: [{key: command, when: {key: method, equals: command}}]}}
  attrs: {method: 5}
  expect: ["attrs.method must be one of command|hook|manual"]
  # when-key present but non-string: conditional never fires (only the independent enum-miss error appears)
- name: conditional_dormant_when_value_mismatch
  spec: {attrs: {required: {method: {enum: [command, hook, manual]}},
                 optional: {command: {type: string}},
                 requires: [{key: command, when: {key: method, equals: command}}]}}
  attrs: {method: hook}
  expect: []
- name: conditional_already_satisfied
  spec: {attrs: {required: {method: {enum: [command, hook, manual]}},
                 optional: {command: {type: string}},
                 requires: [{key: command, when: {key: method, equals: command}}]}}
  attrs: {method: command, command: "pack apply"}
  expect: []
- name: conditional_array_order
  spec: {attrs: {optional: {a: {type: string}, b: {type: string}, flag1: {type: string},
                     flag2: {type: string}},
                 requires: [{key: b, when: {key: flag1, equals: "yes"}},
                            {key: a, when: {key: flag2, equals: "yes"}}]}}
  attrs: {flag1: "yes", flag2: "yes"}
  expect: ["attrs.b is required when flag1=yes", "attrs.a is required when flag2=yes"]
  # array order (author's order), NOT lexicographic (which would put a before b)
- name: required_enum_missing_key_no_phase4_error
  spec: {attrs: {required: {severity: {enum: [low, medium, high]}, count: {type: int}}}}
  attrs: {count: "nope"}
  expect: ["attrs.severity is required", "attrs.count must be a int"]
  # severity wholly absent -> ONLY the phase-1 required error, never also an enum error (phase 4 skips keys absent from attrs by construction)
- name: multi_error_ordering
  spec: {attrs: {required: {alpha: {type: string}, beta: {type: int}},
                 optional: {gamma: {enum: [x, y]}}, closed: true,
                 requires: [{key: delta, when: {key: gamma, equals: x}}]}}
  attrs: {beta: "nope", zeta: 1, gamma: x}
  expect:
    - "attrs.alpha is required"                      # phase 1
    - "attrs.delta is required when gamma=x"          # phase 2 (gamma=x triggers it)
    - "attrs.zeta is not allowed (closed spec)"       # phase 3
    - "attrs.beta must be a int"                      # phase 4 (gamma itself is valid: contributes nothing)
- name: optional_key_omitted_no_error
  spec: {attrs: {required: {a: {type: string}}, optional: {b: {type: string}}}}
  attrs: {a: x}
  expect: []
- name: array_value_against_enum
  spec: {attrs: {required: {tags: {enum: [a, b]}}}}
  attrs: {tags: [1, 2]}
  expect: ["attrs.tags must be one of a|b"]
  # a JSON array is not a JSON string; exercises the array branch of JSON-type classification
- name: object_value_against_string
  spec: {attrs: {required: {note: {type: string}}}}
