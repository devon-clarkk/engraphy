  similarity: 0.9632

# --- Phase C attr-surface recalibration pairs (fact-searchability-phase-c.md §3.2) ---
# Each side carries `attrs`; on the OLD surface these are ignored (embed = title+
# body), on the NEW surface the searchable attrs (strings/dates) render into the
# embedded document. Baselined on the OLD surface first (build order step 1); the
# NEW-surface re-baseline (step 4) measures the shift against these pinned
# before-values. `attrs` uses only construct-searchable keys (string/date).
- name: attr_restatement_same_attrs
  # same entity, same attrs, restated body -> stays >= t_high (absorbs). Adding the
  # identical attr lines to both sides cannot lower similarity.
  a: {title: "Priya's job", body: "Priya works as a paediatric nurse in Leeds.", attrs: {occupation: "paediatric nurse", location: "Leeds"}}
  b: {title: "Priya's occupation", body: "Priya works as a paediatric nurse in Leeds now.", attrs: {occupation: "paediatric nurse", location: "Leeds"}}
  expect_band: merge
  similarity: 0.9788
- name: attr_same_attrs_distinct_body
  # same entity, same attrs, DISTINCT bodies -> the shared attrs push similarity UP
  # relative to bodies alone; a >= t_high landing merge-links (Phase B preserves both).
  a: {title: "Priya news", body: "Priya adopted a rescue greyhound last spring.", attrs: {occupation: "paediatric nurse", location: "Leeds"}}
  b: {title: "Priya update", body: "Priya started training for a marathon this year.", attrs: {occupation: "paediatric nurse", location: "Leeds"}}
  expect_band: insert
  similarity: 0.7341
- name: attr_distinct_dates_locations
  # same shape, DIFFERENT date/location attrs + distinct body -> the differing attr
  # lines push similarity DOWN (distinct facts differentiate further; the over-merge
  # direction moves away from the band).
  a: {title: "Coast trip", body: "The family took a holiday by the sea.", attrs: {occurred_on: "2023-06-15", location: "Brighton"}}
  b: {title: "Mountain trip", body: "The family took a holiday in the hills.", attrs: {occurred_on: "2024-12-20", location: "Snowdonia"}}
  expect_band: pending
  similarity: 0.8586
- name: attr_different_entities_shared_value
  # different entities, one coincidentally-shared attr value (both in Leeds) -> the
  # shared token adds little; distinct occupations/bodies keep them apart.
  a: {title: "Priya", body: "Priya is a paediatric nurse.", attrs: {occupation: "paediatric nurse", location: "Leeds"}}
  b: {title: "Tom", body: "Tom is a secondary-school teacher.", attrs: {occupation: "secondary-school teacher", location: "Leeds"}}
  expect_band: insert
  similarity: 0.6336
- name: attr_less_control_pair
  # NO attrs on either side -> new surface == old surface EXACTLY (tolerance 0). The
  # identity pin: attr-less nodes are unmoved by Phase C.
  a: {title: "Coffee maker descaling", body: "The office coffee machine needs descaling monthly."}
  b: {title: "Descale the coffee machine", body: "The office coffee machine should be descaled every month."}
  expect_band: merge
  similarity: 0.9601
