# Golden fixtures — dedup band selection. Bands are design intent (fixed NOW);
# `similarity` values are baselined by scripts/baseline_dedup_fixtures.py against the
# pinned model (nomic-embed-text-v1.5 @384) in E1, then asserted within ±0.02 forever.
# Re-baselining is allowed ONLY on a deliberate model change (design/04 playbook).
- name: near_identical_auto_merge
  a: {title: "Deploy failed: migration not run", body: "The Azure deploy failed because the backfill migration was never executed before switching the mapper."}
  b: {title: "Deploy failure - migration wasn't run", body: "Azure deploy failed since the backfill migration was not executed prior to switching the mapper."}
  expect_band: merge
  similarity: 0.9897
- name: same_topic_different_incident_pending
